name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          brew install ldid || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Download iOS 16.5 SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build
        run: |
          make clean package FINALPACKAGE=1
          ls -la packages/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: vcamvol-deb
          path: packages/*.deb
          if-no-files-found: error
